[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xanpy-cyanine-atlas"
version = "1.0.0"
description = "Reproducible spectral-shape analysis of archived cyanine absorption and emission traces"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=2.0,<3", "scipy>=1.12,<2", "matplotlib>=3.7,<4"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Chemistry"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
fluodb = ["pandas>=2", "scikit-learn>=1.3", "rdkit>=2024.03", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
